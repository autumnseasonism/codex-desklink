<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">How DeskLink connects your agents</title><desc id="desc">Claude Code or PI talks through local stdio MCP to DeskLink, which reads the local catalog and invokes desktop tools. The original Codex chat shows replies.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a807c"/></marker></defs>
<rect width="1280" height="360" rx="20" fill="#f5f3ec"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="43" font-size="12" font-weight="600" letter-spacing="1.7" fill="#66847e">HOW IT CONNECTS / LOCAL MACHINE</text>
<rect x="44" y="76" width="284" height="172" rx="16" fill="#fffefa" stroke="#dbdfd6"/><circle cx="75" cy="107" r="13" fill="#e8efea"/><text x="71" y="112" font-size="13" font-weight="700" fill="#2e6661">1</text><text x="66" y="154" font-size="25" font-weight="700" fill="#183d43">Claude Code / PI</text><text x="66" y="186" font-size="16" fill="#647970">Find a chat. Read its context.</text><text x="66" y="213" font-size="16" fill="#647970">Request a follow-up.</text>
<path d="M340 161H465" fill="none" stroke="#4a807c" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="140" font-size="12" fill="#4e7169">stdio MCP</text>
<rect x="480" y="76" width="302" height="172" rx="16" fill="#153e46"/><circle cx="512" cy="107" r="13" fill="#386168"/><text x="508" y="112" font-size="13" font-weight="700" fill="#bfe8dd">2</text><text x="505" y="154" font-size="25" font-weight="700" fill="#f4f0e3">Codex DeskLink</text><text x="505" y="186" font-size="16" fill="#c5dfd6">Explicit scope + request ledger</text><text x="505" y="213" font-size="16" fill="#c5dfd6">Read-only local catalog</text>
<path d="M795 161H918" fill="none" stroke="#4a807c" stroke-width="2" marker-end="url(#arrow)"/><text x="800" y="140" font-size="12" fill="#4e7169">desktop tools</text>
<rect x="933" y="76" width="303" height="172" rx="16" fill="#fffefa" stroke="#dbdfd6"/><circle cx="965" cy="107" r="13" fill="#f3e3c8"/><text x="961" y="112" font-size="13" font-weight="700" fill="#936338">3</text><text x="956" y="154" font-size="25" font-weight="700" fill="#183d43">Codex desktop</text><text x="956" y="186" font-size="16" fill="#647970">Same conversation, new turn.</text><text x="956" y="213" font-size="16" fill="#647970">Replies stay visible here.</text>
<path d="M1079 264V292H183V264" fill="none" stroke="#b3bfb4" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="426" y="278" width="428" height="29" rx="14" fill="#f5f3ec"/><text x="447" y="298" font-size="14" fill="#5a736d">Read latest progress and replies through DeskLink</text><text x="44" y="336" font-size="12" fill="#85988e">Concept diagram · model services keep their own network connections</text></g></svg>
